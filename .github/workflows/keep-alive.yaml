name: Keep Alive

# Free Render tier sleeps after ~15 min idle; ping /health to keep it warm.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    name: Ping service
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        env:
          APP_URL: ${{ vars.APP_URL || 'https://joulestracker.onrender.com' }}
        run: |
          for attempt in 1 2 3; do
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 "$APP_URL/health" || true)
            echo "attempt $attempt: GET $APP_URL/health -> $status"
            if [ -n "$status" ] && [ "$status" -lt 500 ]; then
              exit 0
            fi
            sleep 10
          done
          exit 1
