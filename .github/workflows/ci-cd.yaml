name: CI & AI Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Linting and Unit Testing
  # ------------------------------------------------------------------
  test-and-lint:
    name: Test & Lint Code
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: joules_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/joules_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm' # Automatically caches dependencies if package-lock.json exists

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Database Migrations
        run: npx prisma migrate deploy

      - name: Run Unit Tests
        run: npm test
        env:
          JWT_SECRET: test-secret

  # ------------------------------------------------------------------
  # JOB 2: AI Automated Code Review on Pull Requests
  # ------------------------------------------------------------------
  ai-code-review:
    name: AI PR Review
    runs-on: ubuntu-latest
    needs: test-and-lint # Runs only after tests and linting pass
    if: github.event_name == 'pull_request' # Only trigger on PRs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Check for Gemini API key
        id: key-check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "Gemini API key not configured — skipping AI review."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run AI PR-Agent
        if: steps.key-check.outputs.has_key == 'true'
        uses: qodo-ai/pr-agent@main
        env:
          # GitHub token automatically provided by Actions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Provider configuration: Google Gemini via PR-Agent's native provider.
          # PR-Agent reads the model from CONFIG.MODEL / CONFIG.FALLBACK_MODELS
          # (not OPENAI.MODEL), otherwise it falls back to its default GPT models.
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CONFIG.MODEL: "gemini/gemini-3.6-flash"
          CONFIG.FALLBACK_MODELS: '["gemini/gemini-3.6-flash"]'
          # Context size for models PR-Agent does not have in its built-in table.
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "1000000"

          # PR-Agent specific commands to run on creation
          PR_COMMANDS: "[\"/review\", \"/describe\", \"/improve\"]"
