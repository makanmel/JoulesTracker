name: CI & AI Code Review

on:
  pull_request:
    types: [opened, reopened, synchronize]
  push:
    branches:
      - main

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Linting and Unit Testing
  # ------------------------------------------------------------------
  test-and-lint:
    name: Test & Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm' # Automatically caches dependencies if package-lock.json exists

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

  # ------------------------------------------------------------------
  # JOB 2: AI Automated Code Review on Pull Requests
  # ------------------------------------------------------------------
  ai-code-review:
    name: AI PR Review
    runs-on: ubuntu-latest
    needs: test-and-lint # Runs only after tests and linting pass
    if: github.event_name == 'pull_request' # Only trigger on PRs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run AI PR-Agent
        uses: qodo-ai/pr-agent@main
        env:
          # GitHub token automatically provided by Actions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Provider configuration (Choose one model provider below)
          # Example using Google's Gemini (Free Tier available):
          OPENAI.KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI.API_BASE: "https://generativelanguage.googleapis.com/v1beta/openai/"
          OPENAI.MODEL: "gemini-2.5-flash"

          # PR-Agent specific commands to run on creation
          PR_COMMANDS: "[\"/review\", \"/describe\", \"/improve\"]"
